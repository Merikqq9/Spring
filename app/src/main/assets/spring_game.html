<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>SPRING</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#shell{background:#0d0d0d;width:100vw;height:100dvh;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
#gc{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;}
#hud{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px;pointer-events:none;z-index:1;}
#hud-score{color:rgba(255,255,255,0.38);font-size:11px;letter-spacing:0.08em;}
#hud-val{color:#fff;font-weight:500;font-size:26px;line-height:1;}
#hud-right{text-align:right;}
#hud-lvl-label{color:rgba(255,255,255,0.38);font-size:11px;letter-spacing:0.08em;}
#hud-lvl{color:rgba(255,255,255,0.7);font-size:14px;font-weight:500;}
#lvlup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:500;opacity:0;pointer-events:none;letter-spacing:0.14em;z-index:1;}
#menu{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;z-index:10;background:#0d0d0d;}
#menu-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
#menu-title{color:#fff;font-size:52px;font-weight:500;letter-spacing:0.06em;line-height:1;}
#menu-sub{color:rgba(255,255,255,0.25);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;}
#menu-mid{width:100%;padding:0 60px;}
.how-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:0.5px solid rgba(255,255,255,0.06);}
.how-row:last-child{border-bottom:none;}
.how-icon{width:28px;height:28px;border:0.5px solid rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.how-text{color:rgba(255,255,255,0.35);font-size:12px;line-height:1.4;}
#menu-bot{width:100%;padding:28px 40px 36px;display:flex;flex-direction:column;align-items:center;gap:10px;}
#menu-btn{width:100%;padding:14px 0;border:1px solid rgba(255,255,255,0.28);border-radius:40px;background:transparent;color:#fff;font-size:15px;font-family:inherit;letter-spacing:0.05em;cursor:pointer;}
#menu-btn:active{transform:scale(0.97);}
#menu-best{color:rgba(255,255,255,0.22);font-size:12px;min-height:16px;}
#gameover{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,13,13,0.93);z-index:10;}
#go-title{color:#fff;font-size:28px;font-weight:500;letter-spacing:0.06em;margin-bottom:4px;}
#go-sub{color:rgba(255,255,255,0.35);font-size:12px;margin-bottom:28px;}
#go-cards{display:flex;gap:10px;margin-bottom:32px;}
.go-card{width:100px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 10px;text-align:center;}
.go-card-label{color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:5px;}
.go-card-val{color:#fff;font-size:22px;font-weight:500;}
#go-btn{width:200px;padding:13px 0;border:1px solid rgba(255,255,255,0.25);border-radius:40px;background:transparent;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;margin-bottom:10px;}
#go-btn:active{transform:scale(0.97);}
#go-menu-btn{background:transparent;border:none;color:rgba(255,255,255,0.28);font-size:13px;cursor:pointer;font-family:inherit;padding:4px 16px;}
</style>
</head>
<body>
<div id="shell">
  <canvas id="gc" width="380" height="640"></canvas>
  <div id="hud"><div><div id="hud-score">счёт</div><div id="hud-val">0</div></div><div id="hud-right"><div id="hud-lvl-label">уровень</div><div id="hud-lvl">1</div></div></div>
  <div id="lvlup">быстрее!</div>
  <div id="menu"><div id="menu-top"><div id="menu-title">SPRING</div><div id="menu-sub">держи и тяни</div></div><div id="menu-mid"><div class="how-row"><div class="how-icon">👆</div><div class="how-text">Зажми — точка тянется вправо</div></div><div class="how-row"><div class="how-icon">↩️</div><div class="how-text">Отпусти — медленно возвращается</div></div><div class="how-row"><div class="how-icon">🧱</div><div class="how-text">Просвет каждый раз в разном месте</div></div><div class="how-row"><div class="how-icon">⚡</div><div class="how-text">Каждые 5 пролётов становится быстрее</div></div></div><div id="menu-bot"><button id="menu-btn">начать игру</button><div id="menu-best"></div></div></div>
  <div id="gameover"><div id="go-title">game over</div><div id="go-sub">вот что получилось</div><div id="go-cards"><div class="go-card"><div class="go-card-label">пролёты</div><div class="go-card-val" id="go-s">0</div></div><div class="go-card"><div class="go-card-label">уровень</div><div class="go-card-val" id="go-l">1</div></div><div class="go-card"><div class="go-card-label">рекорд</div><div class="go-card-val" id="go-b">0</div></div></div><button id="go-btn">ещё раз</button><button id="go-menu-btn">в меню</button></div>
</div>
<script>
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');const W=380,H=640;const scEl=document.getElementById('hud-val'),lvlEl=document.getElementById('hud-lvl'),lvlupEl=document.getElementById('lvlup');const menuEl=document.getElementById('menu'),gameoverEl=document.getElementById('gameover');const SIDE=16,PR=8,WALL_H=14,OPEN_FRAMES=52;let state='menu',held=false,prevHeld=false;let px,py,walls,score,raf,best=0,lvl,lvlupTimer,spawnTimer,lastZone;let audioCtx=null;const REST_X=SIDE+PR+1,MAX_X=W-SIDE-PR-2;try{best=parseInt(localStorage.getItem('spring_best'))||0;}catch(e){}
function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}function playStretch(){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sawtooth';o.frequency.setValueAtTime(60,a.currentTime);o.frequency.exponentialRampToValueAtTime(180,a.currentTime+0.07);g.gain.setValueAtTime(0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.1);o.start();o.stop(a.currentTime+0.1);}catch(e){}}function playRelease(){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(200,a.currentTime);o.frequency.exponentialRampToValueAtTime(55,a.currentTime+0.15);g.gain.setValueAtTime(0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);o.start();o.stop(a.currentTime+0.15);}catch(e){}}function playPass(){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;o.connect(f);f.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(440,a.currentTime);o.frequency.exponentialRampToValueAtTime(620,a.currentTime+0.07);o.frequency.exponentialRampToValueAtTime(380,a.currentTime+0.14);g.gain.setValueAtTime(0.022,a.currentTime);g.gain.linearRampToValueAtTime(0.028,a.currentTime+0.05);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.2);o.start();o.stop(a.currentTime+0.2);}catch(e){}}function playOpen(){try{const a=ac(),buf=a.createBuffer(1,a.sampleRate*0.18,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)*0.5;const src=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=180;f.Q.value=1.5;src.buffer=buf;src.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.5,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);src.start();src.stop(a.currentTime+0.18);}catch(e){}}
function getParams(l){return{wallSpeed:2.2+l*0.35,spawnInt:Math.max(32,76-l*3),gapW:Math.max(68,155-l*4),pushSpeed:3.2+l*0.2,backSpeed:2.8+l*0.1};}function pickGapX(gapW){const usable=W-SIDE*2-gapW,zones=[0,1,2,3,4],avail=zones.filter(z=>z!==lastZone),zone=avail[Math.floor(Math.random()*avail.length)];lastZone=zone;const gapX=SIDE+Math.round(zone/4*usable);return Math.max(SIDE+2,Math.min(W-SIDE-gapW-2,gapX));}function initGame(){score=0;lvl=0;lvlupTimer=0;spawnTimer=0;lastZone=-1;scEl.textContent='0';lvlEl.textContent='1';px=REST_X;py=H*0.72;walls=[];held=false;prevHeld=false;spawnWall();}function spawnWall(){const p=getParams(lvl),gapW=p.gapW,gapX=pickGapX(gapW);walls.push({y:-WALL_H,gapX,gapW,counted:false,openFrame:0,soundPlayed:false});}function easeOut(t){return 1-(1-t)*(1-t);}function update(){if(state!=='play')return;const p=getParams(lvl);if(held!==prevHeld){if(held)playStretch();else playRelease();prevHeld=held;}spawnTimer++;if(spawnTimer>=p.spawnInt){spawnTimer=0;spawnWall();}px=held?Math.min(MAX_X,px+p.pushSpeed):Math.max(REST_X,px-p.backSpeed);walls.forEach(w=>{w.y+=p.wallSpeed;if(w.openFrame<OPEN_FRAMES){w.openFrame++;if(w.openFrame===1&&!w.soundPlayed){playOpen();w.soundPlayed=true;}}if(!w.counted&&w.y>py+PR+WALL_H){w.counted=true;score++;scEl.textContent=score;lvlEl.textContent=lvl+1;playPass();if(score%5===0){lvl++;lvlupTimer=80;}}});lvlupTimer>0?(lvlupTimer--,lvlupEl.style.opacity=(lvlupTimer/80).toFixed(2)):lvlupEl.style.opacity='0';if(px-PR<SIDE||px+PR>W-SIDE){die();return;}for(const w of walls){const t=easeOut(Math.min(w.openFrame/OPEN_FRAMES,1)),cGW=w.gapW*t,cGX=w.gapX+(w.gapW-cGW)/2,inY=py+PR>w.y&&py-PR<w.y+WALL_H,inGap=px-PR>=cGX&&px+PR<=cGX+cGW;if(inY&&!inGap){die();return;}}walls=walls.filter(w=>w.y<H+20);}function die(){state='dead';cancelAnimationFrame(raf);if(score>best){best=score;try{localStorage.setItem('spring_best',best);}catch(e){}}document.getElementById('go-s').textContent=score;document.getElementById('go-l').textContent=lvl+1;document.getElementById('go-b').textContent=best;gameoverEl.style.display='flex';}function drawArrow(w){const t=easeOut(Math.min(w.openFrame/OPEN_FRAMES,1));if(t<0.5)return;const cGW=w.gapW*t,cGX=w.gapX+(w.gapW-cGW)/2,cx=cGX+cGW/2,ay=w.y-10;ctx.fillStyle=`rgba(255,255,255,${(t-0.5)*0.5})`;ctx.beginPath();ctx.moveTo(cx,ay+6);ctx.lineTo(cx-5,ay);ctx.lineTo(cx+5,ay);ctx.closePath();ctx.fill();}function drawSpring(){const x0=SIDE-2,x1=px-PR-1,len=x1-x0;if(len<=2)return;const stretch=len/(W*0.7),amp=Math.max(1.5,7-stretch*5);ctx.beginPath();ctx.moveTo(x0,py);for(let i=0;i<=28;i++){const t=i/28;ctx.lineTo(x0+t*len,py+(i%2===0?-amp:amp));}ctx.lineTo(x1,py);ctx.strokeStyle=`rgba(255,255,255,${0.25+stretch*0.4})`;ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(x0-4,py-5,5,10);}function draw(){ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(0,0,SIDE,H);ctx.fillRect(W-SIDE,0,SIDE,H);ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(SIDE,0);ctx.lineTo(SIDE,H);ctx.stroke();ctx.beginPath();ctx.moveTo(W-SIDE,0);ctx.lineTo(W-SIDE,H);ctx.stroke();for(const w of walls){const t=easeOut(Math.min(w.openFrame/OPEN_FRAMES,1)),cGW=w.gapW*t,cGX=w.gapX+(w.gapW-cGW)/2;ctx.fillStyle='#fff';const lw=cGX-SIDE;if(lw>0)ctx.fillRect(SIDE,w.y,lw,WALL_H);const rx=cGX+cGW,rw=W-SIDE-rx;if(rw>0)ctx.fillRect(rx,w.y,rw,WALL_H);if(t>0.05&&t<0.98){const gv=(1-t)*0.45;ctx.fillStyle=`rgba(255,255,255,${gv})`;ctx.fillRect(cGX-2,w.y,3,WALL_H);ctx.fillRect(cGX+cGW-1,w.y,3,WALL_H);}ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(cGX,w.y,cGW,WALL_H);drawArrow(w);}drawSpring();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,PR,0,Math.PI*2);ctx.fill();if(held){ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,PR+6,0,Math.PI*2);ctx.stroke();}}function loop(){update();draw();if(state==='play')raf=requestAnimationFrame(loop);}function startGame(){menuEl.style.display='none';gameoverEl.style.display='none';initGame();state='play';cancelAnimationFrame(raf);loop();}function goMenu(){state='menu';cancelAnimationFrame(raf);gameoverEl.style.display='none';document.getElementById('menu-best').textContent=best>0?'рекорд: '+best:'';menuEl.style.display='flex';}
document.getElementById('menu-btn').addEventListener('pointerdown',e=>{e.stopPropagation();startGame();});document.getElementById('go-btn').addEventListener('pointerdown',e=>{e.stopPropagation();startGame();});document.getElementById('go-menu-btn').addEventListener('pointerdown',e=>{e.stopPropagation();goMenu();});const shell=document.getElementById('shell'),btns=()=>[document.getElementById('menu-btn'),document.getElementById('go-btn'),document.getElementById('go-menu-btn')];shell.addEventListener('pointerdown',e=>{if(btns().includes(e.target))return;if(state==='play')held=true;});shell.addEventListener('pointerup',()=>held=false);shell.addEventListener('pointerleave',()=>held=false);shell.addEventListener('touchstart',e=>{if(btns().includes(e.target))return;if(state==='play'){e.preventDefault();held=true;}},{passive:false});shell.addEventListener('touchend',()=>held=false);if(best>0)document.getElementById('menu-best').textContent='рекорд: '+best;
</script>
</body>
</html>
